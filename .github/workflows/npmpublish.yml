name: Publish validated package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm channel
        type: choice
        options: [next, latest]
        default: next
      approved_version:
        description: Exact stable version approved for publication (latest only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: library
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: receipt-*
          merge-multiple: true
          path: artifacts
      - run: node tools/verify-release.mjs --publish --channel "$RELEASE_CHANNEL" --approved-version "$APPROVED_VERSION"
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
