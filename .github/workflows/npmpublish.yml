name: Publish validated package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: npm channel
        type: choice
        options: [next, latest]
        default: next
      approved_version:
        description: Exact stable version approved for publication (latest only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: library
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: receipt-*
          merge-multiple: true
          path: artifacts
      - run: |
          if [ "$RELEASE_EVENT" = release ]; then
            APPROVED_VERSION="${RELEASE_TAG#v}"
            if [ "$RELEASE_PRERELEASE" = true ]; then
              RELEASE_CHANNEL=next
            else
              RELEASE_CHANNEL=latest
            fi
          fi
          node tools/verify-release.mjs --publish --channel "$RELEASE_CHANNEL" --approved-version "$APPROVED_VERSION" --release-tag "$RELEASE_TAG"
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
