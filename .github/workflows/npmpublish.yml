name: Publish validated v5 package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      approved_version:
        description: Exact v5 version approved for publication
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: v5-library
          path: dist
      - name: Check the release version
        run: |
          VERSION=$(node -p "require('./projects/ng-mat-select-infinite-scroll/package.json').version")
          test "$VERSION" = "${APPROVED_VERSION#v}"
          test "$VERSION" = 5.0.0
          test "$IS_PRERELEASE" != true
      - run: npm publish dist/*.tgz --tag legacy
    env:
      APPROVED_VERSION: ${{ github.event.release.tag_name || inputs.approved_version }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
