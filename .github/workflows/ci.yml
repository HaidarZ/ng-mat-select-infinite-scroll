name: Validate v5

on:
  pull_request:
  push:
    branches: [master, 'support/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18.19.0'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: v5-library
          path: dist/*.tgz

  consumers:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [angular-15-minimum, angular-15, angular-16-minimum, angular-16]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: v5-library
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: '18.19.0'
      - run: npm ci --prefix compat/${{ matrix.fixture }} --ignore-scripts --no-audit
      - name: Install the packed library and build the consumer
        working-directory: compat/${{ matrix.fixture }}
        run: |
          cp -R ../template src
          npm install ../../dist/*.tgz --no-save --package-lock=false --ignore-scripts --no-audit
          npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - run: npm ci --prefix compat/browser-tests --ignore-scripts --no-audit
      - run: node compat/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - run: node compat/browser-tests/node_modules/playwright/cli.js test --config compat/browser-tests/playwright.config.mjs
        env:
          CONSUMER: ${{ matrix.fixture }}
      - uses: actions/upload-artifact@v4
        with:
          name: v5-${{ matrix.fixture }}
          path: artifacts/*.json
